[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glowbug"
version = "1.4.19"
description = "Host daemon for Glowbug — the desk device that shows your Claude Code sessions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Glowbug" }]
keywords = ["claude-code", "hardware", "status", "desk-toy"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://glowbug.dev"
Source = "https://github.com/pud/glowbug"

[project.scripts]
glowbug = "glowbug:main"

[tool.setuptools]
py-modules = ["glowbug"]
